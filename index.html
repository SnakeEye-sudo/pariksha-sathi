<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<meta name="description" content="Pariksha Sathi – Competitive exam study planner with daily targets and streak tracking">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pariksha Sathi 📚</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #101828;
    --surface2: #162035;
    --border: rgba(99,102,241,0.18);
    --accent: #6366f1;
    --accent2: #818cf8;
    --gold: #fbbf24;
    --green: #4ade80;
    --red: #f87171;
    --text: #eef2ff;
    --muted: #6680aa;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  [data-theme="light"] { --bg: #eef2ff; --surface: #fff; --surface2: #e0e7ff; --text: #1e1b4b; --muted: #6366f1; --border: rgba(99,102,241,0.2); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-sub { font-size: 11px; color: var(--muted); }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 80px; }

  /* DASHBOARD */
  .dashboard { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

  .exam-hero {
    background: linear-gradient(135deg, #1e1b4b, #162035);
    border: 1.5px solid rgba(99,102,241,0.3);
    border-radius: 24px;
    padding: 22px;
    position: relative;
    overflow: hidden;
  }
  .exam-hero::after { content: '📚'; position: absolute; right: 16px; bottom: 12px; font-size: 64px; opacity: 0.15; }
  .exam-hero-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .exam-hero-name { font-size: 24px; font-weight: 800; margin: 4px 0 2px; }
  .exam-hero-date { font-size: 13px; color: var(--accent2); }
  .exam-hero-days { font-size: 14px; font-weight: 700; color: var(--gold); margin-top: 12px; }
  .exam-progress-bar { height: 8px; background: var(--surface2); border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .exam-progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #818cf8); border-radius: 4px; transition: width 0.5s; }

  .quick-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .qstat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 10px; text-align: center; }
  .qstat-val { font-size: 24px; font-weight: 800; color: var(--accent2); }
  .qstat-key { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.3; }

  /* TODAY'S TASKS */
  .today-tasks { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 14px;
    background: var(--surface2); border: 1px solid var(--border);
    cursor: pointer; transition: all 0.2s;
  }
  .task-item.done { opacity: 0.6; }
  .task-check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    background: var(--surface); flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.2s;
  }
  .task-item.done .task-check { background: var(--accent); border-color: var(--accent); }
  .task-info { flex: 1; min-width: 0; }
  .task-name { font-size: 14px; font-weight: 600; }
  .task-item.done .task-name { text-decoration: line-through; color: var(--muted); }
  .task-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .task-dur { font-size: 12px; font-weight: 700; color: var(--accent2); white-space: nowrap; }
  .del-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid rgba(248,113,113,0.3); background: rgba(248,113,113,0.1); color: var(--red); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* ADD TASK */
  .add-task-form { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .form-row { display: flex; gap: 10px; }
  .fi { flex: 1; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; font-family: var(--font); outline: none; transition: border-color 0.2s; }
  .fi:focus { border-color: var(--accent); }
  .fi::placeholder { color: var(--muted); }
  .subj-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .subj-btn { padding: 7px 12px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.2s; }
  .subj-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .add-task-btn { width: 100%; padding: 15px; border-radius: 16px; border: none; background: var(--accent); color: white; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: all 0.2s; box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
  .add-task-btn:active { transform: scale(0.97); }

  /* SUBJECTS */
  .subjects-section { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
  .subj-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; }
  .subj-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .subj-name { font-size: 15px; font-weight: 700; }
  .subj-progress-text { font-size: 12px; color: var(--accent2); font-weight: 700; }
  .subj-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .subj-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }
  .subj-topics { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* EXAMS */
  .exams-section { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
  .exam-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
  .exam-card-name { font-size: 16px; font-weight: 800; }
  .exam-card-date { font-size: 13px; color: var(--accent2); margin-top: 4px; }
  .exam-card-days { font-size: 14px; color: var(--gold); margin-top: 8px; font-weight: 700; }
  .add-exam-form { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin: 0 20px; display: flex; flex-direction: column; gap: 10px; }

  .section-header { padding: 16px 20px 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .empty-state { text-align: center; padding: 24px; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 16px; border-radius: 12px; cursor: pointer; border: none; background: none; color: var(--muted); font-family: var(--font); transition: all 0.2s; }
  .nav-item.active { color: var(--accent); }
  .nav-item span { font-size: 10px; font-weight: 600; }
  .nav-item svg { width: 22px; height: 22px; }
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body data-theme="dark">

<div class="topbar">
  <div class="topbar-brand">
    <span style="font-size:22px">📚</span>
    <div>
      <div class="topbar-title">Pariksha Sathi</div>
      <div class="topbar-sub">Exam Study Planner</div>
    </div>
  </div>
  <button class="icon-btn" id="themeBtn">🌙</button>
</div>

<div class="main">

  <!-- DASHBOARD VIEW -->
  <div class="view active" id="view-dashboard">
    <div class="dashboard">
      <!-- Exam Hero -->
      <div class="exam-hero" id="examHero">
        <div class="exam-hero-label">Teri pariksha</div>
        <div class="exam-hero-name" id="heroName">Koi exam set nahi</div>
        <div class="exam-hero-date" id="heroDate">Exams tab mein jao</div>
        <div class="exam-hero-days" id="heroDays"></div>
        <div class="exam-progress-bar"><div class="exam-progress-fill" id="heroProgress" style="width:0%"></div></div>
      </div>

      <!-- Quick stats -->
      <div class="quick-stats">
        <div class="qstat"><div class="qstat-val" id="statStreak">0🔥</div><div class="qstat-key">Study streak</div></div>
        <div class="qstat"><div class="qstat-val" id="statDone">0</div><div class="qstat-key">Tasks done today</div></div>
        <div class="qstat"><div class="qstat-val" id="statTotal">0</div><div class="qstat-key">Total tasks</div></div>
      </div>

      <!-- Today's tasks -->
      <div class="today-tasks">
        <div class="section-title">
          <span>📋 Aaj ke tasks</span>
          <span style="font-size:12px;color:var(--muted)" id="todayProg">0/0 done</span>
        </div>
        <div class="task-list" id="todayTasks">
          <div class="empty-state" style="padding:16px">Koi task nahi. Niche se add karo!</div>
        </div>
      </div>

      <!-- Add task -->
      <div class="add-task-form">
        <div class="section-title" style="margin-bottom:8px">➕ Naya task</div>
        <input class="fi" id="taskNameInput" type="text" placeholder="Task ka naam (e.g. Current Affairs Chapter 3)">
        <div class="form-row">
          <input class="fi" id="taskDurInput" type="number" placeholder="Minutes" min="15" max="480">
          <select class="fi" id="taskPriorityInput">
            <option value="high">🔴 High</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
        <div class="subj-row" id="subjRow">
          <button class="subj-btn" onclick="selSubj(this)">📰 GK/Current</button>
          <button class="subj-btn" onclick="selSubj(this)">🔢 Math</button>
          <button class="subj-btn" onclick="selSubj(this)">🔤 English</button>
          <button class="subj-btn" onclick="selSubj(this)">🧪 Science</button>
          <button class="subj-btn" onclick="selSubj(this)">🏛️ History</button>
          <button class="subj-btn" onclick="selSubj(this)">🗺️ Geography</button>
          <button class="subj-btn" onclick="selSubj(this)">⚖️ Polity</button>
          <button class="subj-btn" onclick="selSubj(this)">💰 Economy</button>
        </div>
        <button class="add-task-btn" onclick="addTask()">+ Task Add Karo</button>
      </div>
    </div>
  </div>

  <!-- EXAMS VIEW -->
  <div class="view" id="view-exams">
    <div class="section-header">Apne exams add karo</div>
    <div class="add-exam-form">
      <input class="fi" id="examNameInput" type="text" placeholder="Exam ka naam (e.g. UPSC CSE 2025, SSC CGL)">
      <div class="form-row">
        <input class="fi" id="examDateInput" type="date">
        <input class="fi" id="examNotesInput" type="text" placeholder="Notes (optional)">
      </div>
      <button class="add-task-btn" onclick="addExam()">+ Exam Add Karo</button>
    </div>
    <div class="section-header">Teri exam list</div>
    <div class="exams-section" id="examsList">
      <div class="empty-state">Koi exam set nahi. Upar se add karo!</div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Dashboard</span>
  </button>
  <button class="nav-item" data-view="exams">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    <span>Exams</span>
  </button>
</nav>

<script>
const STORAGE_KEY = 'pariksha-v3';
const PRIORITY_COLORS = { high:'#f87171', medium:'#fbbf24', low:'#4ade80' };
let data = load();
let selSubjVal = '';

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"tasks":[],"exams":[],"streak":0,"lastDate":""}'); }
  catch { return { tasks: [], exams: [], streak: 0, lastDate: '' }; }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function selSubj(btn) {
  document.querySelectorAll('.subj-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selSubjVal = btn.textContent.trim();
}

function addTask() {
  const name = document.getElementById('taskNameInput').value.trim();
  const dur = parseInt(document.getElementById('taskDurInput').value) || 60;
  const priority = document.getElementById('taskPriorityInput').value;
  if (!name) { alert('Task ka naam dalo!'); return; }
  const today = new Date().toDateString();
  data.tasks.unshift({ id: Date.now(), name, dur, priority, subject: selSubjVal, date: today, done: false });
  document.getElementById('taskNameInput').value = '';
  document.getElementById('taskDurInput').value = '';
  save(); updateUI();
}

function toggleTask(id) {
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;
  task.done = !task.done;
  if (task.done) {
    const today = new Date().toDateString();
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (data.lastDate !== today) {
      if (data.lastDate === yesterday) data.streak++;
      else data.streak = 1;
      data.lastDate = today;
    }
  }
  save(); updateUI();
}

function deleteTask(id) {
  data.tasks = data.tasks.filter(t => t.id !== id);
  save(); updateUI();
}

function addExam() {
  const name = document.getElementById('examNameInput').value.trim();
  const date = document.getElementById('examDateInput').value;
  const notes = document.getElementById('examNotesInput').value.trim();
  if (!name || !date) { alert('Exam naam aur date dono chahiye!'); return; }
  data.exams.push({ id: Date.now(), name, date, notes });
  document.getElementById('examNameInput').value = '';
  document.getElementById('examDateInput').value = '';
  document.getElementById('examNotesInput').value = '';
  save(); updateUI(); renderExams();
}

function deleteExam(id) {
  data.exams = data.exams.filter(e => e.id !== id);
  save(); updateUI(); renderExams();
}

function updateUI() {
  const today = new Date().toDateString();
  const todayTasks = data.tasks.filter(t => t.date === today || !t.done);
  const done = todayTasks.filter(t => t.done).length;
  document.getElementById('statStreak').textContent = data.streak + '🔥';
  document.getElementById('statDone').textContent = done;
  document.getElementById('statTotal').textContent = data.tasks.length;
  document.getElementById('todayProg').textContent = `${done}/${todayTasks.length} done`;

  // Tasks
  const el = document.getElementById('todayTasks');
  if (!todayTasks.length) { el.innerHTML = '<div class="empty-state" style="padding:16px">Koi task nahi.</div>'; }
  else {
    el.innerHTML = todayTasks.map(t => `
      <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask(${t.id})">
        <div class="task-check">${t.done ? '✓' : ''}</div>
        <div class="task-info">
          <div class="task-name">${t.name}</div>
          <div class="task-meta">${t.subject || 'General'} • <span style="color:${PRIORITY_COLORS[t.priority]}">${t.priority}</span></div>
        </div>
        <span class="task-dur">${t.dur}m</span>
        <button class="del-btn" onclick="deleteTask(${t.id});event.stopPropagation()">✕</button>
      </div>
    `).join('');
  }

  // Nearest exam
  const upcoming = data.exams.sort((a,b) => new Date(a.date)-new Date(b.date)).find(e => new Date(e.date) >= new Date());
  if (upcoming) {
    const days = Math.ceil((new Date(upcoming.date) - new Date()) / 86400000);
    const pct = Math.max(0, Math.min(100, ((365 - days) / 365) * 100));
    document.getElementById('heroName').textContent = upcoming.name;
    document.getElementById('heroDate').textContent = new Date(upcoming.date).toLocaleDateString('hi-IN', { dateStyle: 'full' });
    document.getElementById('heroDays').textContent = `⏳ ${days} din bache hain`;
    document.getElementById('heroProgress').style.width = pct + '%';
  }
}

function renderExams() {
  const el = document.getElementById('examsList');
  if (!data.exams.length) { el.innerHTML = '<div class="empty-state">Koi exam set nahi.</div>'; return; }
  el.innerHTML = data.exams.sort((a,b) => new Date(a.date)-new Date(b.date)).map(e => {
    const days = Math.ceil((new Date(e.date) - new Date()) / 86400000);
    const isPast = days < 0;
    return `
      <div class="exam-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="exam-card-name">${e.name}</div>
            <div class="exam-card-date">📅 ${new Date(e.date).toLocaleDateString('hi-IN', { dateStyle: 'full' })}</div>
            ${e.notes ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">${e.notes}</div>` : ''}
            <div class="exam-card-days">${isPast ? '✅ Complete ho gaya' : `⏳ ${days} din bache`}</div>
          </div>
          <button class="del-btn" onclick="deleteExam(${e.id})" style="flex-shrink:0">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

// NAV
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('view-' + item.dataset.view).classList.add('active');
    if (item.dataset.view === 'exams') renderExams();
  });
});

// THEME
const savedTheme = localStorage.getItem('pariksha-theme') || 'dark';
document.body.dataset.theme = savedTheme;
document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
document.getElementById('themeBtn').addEventListener('click', () => {
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = t;
  document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('pariksha-theme', t);
});

updateUI();
</script>
</body>
</html>
